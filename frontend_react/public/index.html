<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tarun Vashishtha — Software Engineer</title>
    <meta
      name="description"
      content="Tarun Vashishtha is a software engineer building AI-powered apps, web platforms and thoughtful interfaces."
    />
    <meta name="theme-color" content="#07070a" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tarun Vashishtha — Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer building AI-powered apps, web platforms and thoughtful interfaces."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:creator" content="@_tarun_v" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Apply the saved (or OS) theme before first paint so there is no flash. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f5f1');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
